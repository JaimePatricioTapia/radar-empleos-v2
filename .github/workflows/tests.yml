name: Python tests # includes the one-click search pipeline branch

on:
  push:
    branches:
      - main
      - feature/semantic-evaluation-ranking
      - feature/affinity-threshold-mining-filter
      - feature/one-click-search-85-affinity
  pull_request:
    branches:
      - main
      - feature/multisource-job-discovery-stage1
      - feature/semantic-evaluation-ranking
      - feature/affinity-threshold-mining-filter
      - feature/one-click-search-85-affinity

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        run: pytest -q
